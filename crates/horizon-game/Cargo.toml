[package]
name = "horizon-game"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The game as the platform runs it: the engine's entry with the platform's parts registered, for an executable to start (docs/layers.md)"

[dependencies]
horizon-guest-stack = { path = "../horizon-guest-stack" }
horizon-client = { path = "../horizon-client", default-features = false }
horizon-mod-package = { path = "../horizon-mod-package", default-features = false, features = ["index"] }

horizon-mod-host = { path = "../horizon-mod-host", default-features = false }

[lints]
workspace = true

# The binary holds no tests (the library does): `cargo test` builds no empty test harness for it, which linked the
# whole crate again. It still builds for integration tests (CARGO_BIN_EXE_*) and clippy --all-targets.
[[bin]]
name = "horizon-client"
path = "src/main.rs"
test = false

[features]
# horizon-client/client-lib-default: one build of the game whether or not horizon-client-lib is also named.
default = ["audio", "controllers", "horizon-extras", "horizon-client/client-lib-default", "desktop"]
# The desktop group: the PC-only features, agent control and the rest; more join it later
# (docs/unification/mobile-trim-plan.md).
desktop = ["agent-control", "benchmark", "telemetry-store", "desktop-opener"]
# The mobile group: what a phone build carries; the desktop group stays out.
mobile = ["horizon-client/audio"]
# Agent control: the control socket and horizon-ctl's commands (horizon-client's feature).
agent-control = ["horizon-client/agent-control"]
# `--benchmark SCENARIO`: the run's scenes and report (horizon-client's feature).
benchmark = ["horizon-client/benchmark"]
# Opt-in data collection's store (horizon-client's feature).
telemetry-store = ["horizon-client/telemetry-store"]
# Opening a folder or a link in the desktop's handler (horizon-client's feature).
desktop-opener = ["horizon-client/desktop-opener"]
audio = ["horizon-client/audio"]
controllers = ["horizon-client/controllers"]
horizon-extras = ["horizon-client/horizon-extras"]
testing = ["horizon-client/testing"]
friends = ["horizon-client/friends"]
rng-trace = ["horizon-client/rng-trace"]
system-allocator = ["horizon-client/system-allocator"]
alloc-census = ["horizon-client/alloc-census"]
alloc-count = ["horizon-client/alloc-count"]
windows-mimalloc = ["horizon-client/windows-mimalloc"]
windows-segment-heap = ["horizon-client/windows-segment-heap"]

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
horizon-protocol = { path = "../horizon-protocol" }
tempfile = "3"
horizon-core = { path = "../horizon-core" }
serde_json = "1"
