[package]
name = "horizon-guest-stack"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Guest stack reservations and executable startup without allocator dependencies"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Moving a thread onto a stack of its own (`OwnStack`): iOS's main thread.
[target.'cfg(target_os = "ios")'.dependencies]
psm = "0.1.32"

[dev-dependencies]
psm = "0.1.32"

[lints]
workspace = true
