[package]
name = "magnetite-ios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Magnetite iOS: the app executable that starts the shared core on an iPhone or iPad"

[[bin]]
# CFBundleExecutable in packaging/ios/Info.plist.
name = "magnetite"
path = "src/main.rs"

[target.'cfg(target_os = "ios")'.dependencies]
horizon-client = { path = "../horizon-client", default-features = false, features = ["mobile"] }
horizon-mod-host = { path = "../horizon-mod-host", default-features = false, features = ["mobile"] }
# The refresh-secret store the boot loop keeps (a private file in Application Support).
horizon-account = { path = "../horizon-account" }
# The window's orientations (`WindowExtIOS`): the workspace patches this to third_party/winit.
winit = "0.30.13"

# Safari, the idle timer (UIApplication) and the clipboard (UIPasteboard). The bindings winit already lays down for this target:
# UIKit's generated methods need the matching objc2 0.5 runtime, and `block2` is what
# `openURL:options:completionHandler:` takes (a nil handler, so no block outlives the call).
[target.'cfg(target_os = "ios")'.dependencies.objc2]
version = "0.5.3"

[target.'cfg(target_os = "ios")'.dependencies.objc2-foundation]
version = "0.2.2"
default-features = false
features = ["std", "NSThread", "NSString", "NSURL", "NSDictionary", "NSLocale", "NSArray"]

[target.'cfg(target_os = "ios")'.dependencies.objc2-ui-kit]
version = "0.2.2"
default-features = false
features = [
    "std",
    "block2",
    "UIApplication",
    "UIResponder",
    "UIPasteboard",
    # The log's share sheet: one string in an NSArray, presented from the key window's root
    # view controller, anchored on its view where the sheet opens as a popover (iPad).
    "UIActivity",
    "UIActivityViewController",
    "UIViewController",
    "UIView",
    "UIWindow",
    "UIPopoverPresentationController",
    "UIPresentationController",
]

[lints]
workspace = true
