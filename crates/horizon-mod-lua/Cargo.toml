[package]
name = "horizon-mod-lua"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Lua (LuaJIT) mods: scripts that implement the same hooks as native and wasm mods"

[dependencies]
mlua = { version = "0.12", features = ["luajit", "vendored", "send", "serialize"] }
mod_api = { package = "horizon-mod-api", path = "../horizon-mod-api" }
horizon-core = { path = "../horizon-core" }
log = "0.4"
serde_json = "1"

[build-dependencies]
horizon-mod-api-gen = { path = "../horizon-mod-api-gen" }

[dev-dependencies]
mod_api = { package = "horizon-mod-api", path = "../horizon-mod-api", features = ["testing"] }

[lints]
workspace = true
