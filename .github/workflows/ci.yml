# Magnetite CI on GitHub's free hosted runners: one core, three platforms checked from the same commit.
# All three jobs gate: the PC build with the mobile profile, and the same core checked for Android and
# iOS. The phones' platform layers are still being ported (docs/unification/plan.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  desktop:
    name: PC (default features) and the mobile profile
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust and the ALSA and udev headers the client links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: Check the PC build
        run: cargo check --locked -p horizon-game
      - name: Check the mobile profile on the host
        run: cargo check --locked -p horizon-game --no-default-features --features mobile

  android:
    name: Android (aarch64, mobile profile)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust with the Android target
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Check against the NDK the image ships
        run: |
          ndk_bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$ndk_bin/aarch64-linux-android28-clang"
          export CXX_aarch64_linux_android="$ndk_bin/aarch64-linux-android28-clang++"
          export AR_aarch64_linux_android="$ndk_bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo check --locked -p horizon-game --target aarch64-linux-android --no-default-features --features mobile

  ios:
    name: iOS (aarch64, mobile profile)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust with the iOS target
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-ios
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Check with Xcode's iOS SDK
        run: cargo check --locked -p horizon-game --target aarch64-apple-ios --no-default-features --features mobile
