# Magnetite Android's APK, for a phone: the core built for aarch64-linux-android with the mobile
# profile, wrapped by packaging/android. Run by hand (Actions → android-apk → Run workflow) and for
# release tags. A whole optimized game build takes a while, so it doesn't run on every push.
name: android-apk

on:
  workflow_dispatch:
  push:
    tags: ['v*', 'e4mc-v*']

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Built into the game (option_env!): the Azure app for Microsoft sign-in and the tables release
  # for the game files. Repository variables, not secrets: client IDs and release URLs are public.
  MAGNETITE_MSA_CLIENT_ID: ${{ vars.MAGNETITE_MSA_CLIENT_ID }}
  MAGNETITE_TABLES_URL: ${{ vars.MAGNETITE_TABLES_URL }}
  MAGNETITE_TABLES_SHA256: ${{ vars.MAGNETITE_TABLES_SHA256 }}

# A tag's run attaches the APK to the tag's GitHub release.
permissions:
  contents: write

jobs:
  apk:
    name: APK (arm64-v8a, debug-signed)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: The version (the tag's, or a numbered dev build)
        run: |
          case "$GITHUB_REF_NAME" in
            v*) version="${GITHUB_REF_NAME#v}" ;;
            e4mc-v*) version="${GITHUB_REF_NAME#e4mc-v}" ;;
            *) version="0.1.0-dev.${GITHUB_RUN_NUMBER}" ;;
          esac
          echo "MAGNETITE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Rust with the Android target
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-apk
      - name: Build libmagnetite_android.so against the image's NDK
        run: |
          ndk_bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$ndk_bin/aarch64-linux-android28-clang"
          export CXX_aarch64_linux_android="$ndk_bin/aarch64-linux-android28-clang++"
          export AR_aarch64_linux_android="$ndk_bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo build --locked -p magnetite-android --target aarch64-linux-android --profile fast
          mkdir -p .local/android/jni/arm64-v8a .local/android/assets
          "$ndk_bin/llvm-strip" --strip-unneeded \
            -o .local/android/jni/arm64-v8a/libmagnetite_android.so \
            target/aarch64-linux-android/fast/libmagnetite_android.so
          cp LICENSE THIRD_PARTY_NOTICES.md .local/android/assets/
      - name: The wasm mods' standard library member
        # Every wasm mod links against it. The game looks beside its executable, which on Android
        # is the system's app_process: the APK carries it as an asset that magnetite-android hands
        # over. Without it every wasm mod was refused ("no wasm standard library member").
        run: |
          mkdir -p .local/android/assets
          cargo run --locked -p cargo-horizon-mod -- wasm-std "$PWD/.local/android/assets/horizon-wasm-std.wasm"
      - name: Package the APK
        env:
          # The kept test-build key (packaging/android/build.gradle): each APK installs over the
          # last. Absent in a fork's run, which then signs with Gradle's own debug key.
          MAGNETITE_DEBUG_KEYSTORE: ${{ secrets.MAGNETITE_DEBUG_KEYSTORE }}
          MAGNETITE_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.MAGNETITE_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$MAGNETITE_DEBUG_KEYSTORE" ]; then
            export MAGNETITE_DEBUG_KEYSTORE_FILE="$RUNNER_TEMP/magnetite-test.p12"
            printf '%s' "$MAGNETITE_DEBUG_KEYSTORE" | base64 -d > "$MAGNETITE_DEBUG_KEYSTORE_FILE"
          fi
          gradle -p packaging/android -PversionName="$MAGNETITE_VERSION" -PversionCode="${GITHUB_RUN_NUMBER}" assembleDebug
          mkdir -p dist
          cp .local/android/gradle-build/outputs/apk/debug/*.apk "dist/Magnetite-$MAGNETITE_VERSION-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: magnetite-android-arm64
          path: dist/*.apk
          if-no-files-found: error
      - name: Attach to the tag's GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Magnetite $MAGNETITE_VERSION"
          case "$GITHUB_REF_NAME" in e4mc-v*) title="$title (e4mc)";; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --prerelease --title "$title" \
                 --notes-file packaging/release-notes.md \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" "dist/Magnetite-$MAGNETITE_VERSION-android-arm64.apk" --clobber
